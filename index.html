<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSC Quick Document Upload</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; padding: 20px; text-align: center; color: #1e293b; margin: 0; }
    .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
    h2 { margin: 0 0 4px 0; font-size: 18px; color: #1e40af; }
    p { font-size: 12px; color: #64748b; margin-top: 0; }
    .input-box { width: 100%; box-sizing: border-box; padding: 10px; margin-bottom: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; text-align: center; }
    .upload-area { border: 2px dashed #3b82f6; background: #eff6ff; padding: 24px 12px; border-radius: 8px; margin-bottom: 16px; cursor: pointer; }
    .btn { background: #2563eb; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; }
    .btn:disabled { background: #94a3b8; }
    #status { margin-top: 14px; font-size: 13px; font-weight: bold; }
  </style>
</head>
<body>

<div class="card">
  <h2>CSC Document Upload</h2>
  <p>Apna Document select karke Computer par bhejein</p>

  <input type="text" id="custName" class="input-box" placeholder="Apna Naam Daalein (Optional)">

  <div class="upload-area" onclick="document.getElementById('fileInp').click()">
    <div style="font-size: 32px;">📷</div>
    <div style="font-size: 13px; font-weight: bold; color: #1d4ed8; margin-top: 6px;">Camera ya Gallery se Photo Chunein</div>
    <input type="file" id="fileInp" accept="image/*,application/pdf" multiple style="display: none;">
  </div>
  <div id="fileCount" style="font-size: 12px; color: #475569; margin-bottom: 12px;"></div>

  <button id="sendBtn" class="btn" disabled>Send to Computer</button>
  <div id="status"></div>
</div>

<script>
  const FIREBASE_DB_URL = "https://csc-counter-hub-default-rtdb.firebaseio.com";

  const fileInp = document.getElementById('fileInp');
  const sendBtn = document.getElementById('sendBtn');
  const fileCount = document.getElementById('fileCount');
  const statusDiv = document.getElementById('status');
  const custName = document.getElementById('custName');

  fileInp.addEventListener('change', () => {
    if (fileInp.files.length > 0) {
      fileCount.innerText = `${fileInp.files.length} document chuna gaya`;
      sendBtn.disabled = false;
    }
  });

  sendBtn.addEventListener('click', async () => {
    const files = Array.from(fileInp.files);
    if (files.length === 0) return;

    sendBtn.disabled = true;
    statusDiv.innerText = "⏳ Uploading to Counter...";
    statusDiv.style.color = "#2563eb";

    const name = custName.value.trim() || "Customer";

    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      const base64 = await fileToBase64(file);
      
      const payload = {
        customerName: name,
        fileName: file.name,
        fileType: file.type || "image/jpeg",
        base64: base64,
        timestamp: Date.now()
      };

      try {
        await fetch(`${FIREBASE_DB_URL}/uploads.json`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
      } catch (err) {
        statusDiv.innerText = "❌ Upload failed: " + err.message;
        statusDiv.style.color = "#dc2626";
        sendBtn.disabled = false;
        return;
      }
    }

    statusDiv.innerText = "✅ Kaamyab! Documents Computer par bhej diye gaye.";
    statusDiv.style.color = "#16a34a";
    fileInp.value = "";
    fileCount.innerText = "";
  });

  function fileToBase64(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.readAsDataURL(file);
    });
  }
</script>

</body>
</html>
