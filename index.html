<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSC Quick Document Upload</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f1f5f9; padding: 20px; text-align: center; color: #1e293b; margin: 0; }
    .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
    h2 { margin: 0 0 6px 0; font-size: 18px; color: #1e40af; }
    p { font-size: 13px; color: #64748b; margin-top: 0; }
    .upload-area { border: 2px dashed #3b82f6; background: #eff6ff; padding: 24px 12px; border-radius: 8px; margin: 18px 0; cursor: pointer; }
    .btn { background: #2563eb; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; }
    .btn:disabled { background: #94a3b8; }
    #status { margin-top: 14px; font-size: 13px; font-weight: bold; }
  </style>
</head>
<body>

<div class="card">
  <h2>CSC Document Upload</h2>
  <p>Apna Document select karke Computer par bhejein</p>

  <div class="upload-area" onclick="document.getElementById('fileInp').click()">
    <div style="font-size: 32px;">📷</div>
    <div style="font-size: 13px; font-weight: bold; color: #1d4ed8; margin-top: 6px;">Camera ya Gallery se Photo Chunein</div>
    <input type="file" id="fileInp" accept="image/*,application/pdf" multiple style="display: none;">
  </div>
  <div id="fileCount" style="font-size: 12px; color: #475569; margin-bottom: 12px;"></div>

  <button id="sendBtn" class="btn" disabled>Send to Computer</button>
  <div id="status">Connecting to Counter...</div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const targetToken = urlParams.get('token');
  const statusDiv = document.getElementById('status');
  const fileInp = document.getElementById('fileInp');
  const sendBtn = document.getElementById('sendBtn');
  const fileCount = document.getElementById('fileCount');

  if (!targetToken) {
    statusDiv.innerText = "❌ Invalid QR code! Counter par dobara scan karein.";
    statusDiv.style.color = "#dc2626";
  }

  const peer = new Peer();
  let conn = null;

  peer.on('open', () => {
    if (!targetToken) return;
    statusDiv.innerText = "⏳ Connecting to Computer...";
    conn = peer.connect(targetToken);

    conn.on('open', () => {
      statusDiv.innerText = "✅ Counter se connect ho gaya!";
      statusDiv.style.color = "#16a34a";
      if (fileInp.files.length > 0) sendBtn.disabled = false;
    });

    conn.on('error', (err) => {
      statusDiv.innerText = "❌ Connection error. Re-scan karein.";
      statusDiv.style.color = "#dc2626";
    });
  });

  fileInp.addEventListener('change', (e) => {
    if (e.target.files.length > 0) {
      fileCount.innerText = `${e.target.files.length} document chuna gaya`;
      if (conn && conn.open) sendBtn.disabled = false;
    }
  });

  sendBtn.addEventListener('click', () => {
    const files = Array.from(fileInp.files);
    if (files.length === 0 || !conn || !conn.open) return;

    sendBtn.disabled = true;
    statusDiv.innerText = "⏳ Uploading to Counter...";

    let sent = 0;
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = () => {
        conn.send({
          fileName: file.name,
          fileType: file.type || "image/jpeg",
          base64: reader.result
        });
        sent++;
        if (sent === files.length) {
          statusDiv.innerText = "🎉 Documents Computer par bhej diye gaye!";
          statusDiv.style.color = "#16a34a";
        }
      };
      reader.readAsDataURL(file);
    });
  });
</script>

</body>
</html>
